; Hospital LED panel driver — RP2040-Zero (V1083 clone) target.
;
; Two deliberate changes from the original config:
;
; 1. platform = maxgerhardt fork + board_build.core = earlephilhower.
;    The official `platform = raspberrypi` with `board = pico` defaults to the
;    mbed core, which is where the Serial.printf gap and the blocking-Serial
;    trap both came from. The earlephilhower core avoids both and is what the
;    MIDI clock project already uses — keeping the two projects on one toolchain.
;
; 2. board = waveshare_rp2040_zero.
;    The Zero has 2MB flash, not the Pico's 4MB. A `pico` build can flash and
;    appear to work while being wrong about the top of flash. This firmware is
;    small enough that it likely never mattered, but relying on staying small
;    is not a plan.

[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
board_build.core = earlephilhower
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Flashing: BOOTSEL + copy the UF2, e.g.
;   cp .pio/build/rp2040zero/firmware.uf2 /media/rich/RPI-RP2/
